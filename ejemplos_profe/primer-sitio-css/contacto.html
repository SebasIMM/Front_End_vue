<head>

    <meta name="keywords" content="HTML, CSS, Javascript">
    <meta name="description" content="Desarrollo Web">

    <!--base: etiqueta que sirve para definir una url base para las futuras direcciones web locales-->
    <!--
    <base href="https://www.lala.com/" target="_self">
    -->

    <!--link: etiqueta para relacionar los ficheros css y/o iconos-->
    <link rel="stylesheet" href="assets/css/estilos.css">

    <!--favicon: forma de agregar un ícono a la pestaña de la página en el navegador-->
    <link rel="shortcut icon" href="assets/img/rocket.svg" type="image/x-icon">

    <!--script: etiqueta que sirve para agregar código javascript o ficheros js-->
    <script></script>

    <!--title: etiqueta que sirve para agregar título-->
    <title>Mi primer sitio | Manejo de Formularios</title>
</head>
<body>
    <header>
        <h1>Hola Mundo!!!</h1>
        <h2>En esta página veremos como crear un formulario de contacto</h2>
    </header>

    <nav>
        <a href="index.html" target="_self">Home</a>
        <a href="tablas.html" target="_self">Tablas</a>
        <a href="contacto.html" target="_self">Contacto</a>
    </nav>

    <section>
        <article>
            <h3 class="subrayado">Manejo de Formulario</h3>
            <form action="" method="post" enctype="multipart/form-data">
                <label class="label" for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" maxlength="30" size="50" placeholder="Ingrese su nombre completo" required>
                <br>
                <br>
                <label class="label" for="email">Email</label>
                <input type="email" name="email" id="email" maxlength="100" size="50" placeholder="Ingrese su correo electrónico" required>
                <br>
                <br>
                <label class="label" for="password">Password</label>
                <input type="password" name="password" id="password" maxlength="100" size="50" required>
                <br>
                <br>
                <label class="label" for="fnac">Fecha Nacimiento</label>
                <input type="date" name="fnac" id="fnac" min="1900-01-01" max="2030-12-31">
                <br>
                <br>
                <label class="label" for="hnac">Hora Nacimiento</label>
                <input type="time" name="hnac" id="hnac">
                <br>
                <br>
                <label class="label" for="autos" >Cuantos autos te gustaría tener?</label>
                <input type="number" name="autos" id="autos" value="0" min="0" max="100" step="1" aria-label="Ingresar la cantidad de autos que tienes">
                <br>
                <br>
                <label class="label" for="color">Selecciona tu color favorito</label>
                <input type="color" name="color" id="color">
                <br>
                <br>
                <label class="label" for="file">Deseas incluir una fotografía para tu perfil</label>
                <input type="file" name="file" id="file">
                <br>
                <br>
                <label class="label" for="genero">Cúal es tu género?</label>
                <select name="gender" id="gender">
                    <option value="Género" disable selected>Selecciona tu género</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                    <option value="roca">Soy una roca</option>
                    <option value="otro">Otro</option>
                </select>
                <br>
                <br>
                <label class="label" for="question">Qué fue primero:</label>
                <br>
                <input type="radio" id="huevo" name="radio" value="huevo" checked>
                <label for="huevo">Huevo</label>
                <br>
                <input type="radio" id="gallina" name="radio" value="gallina">
                <label for="gallina">Gallina</label>
                <br>
                <br>
                <label class="label" for="lenguajes">Cuales son los lenguajes de programación que conoces? (marcas todas las opciones necesarias)</label>
                <br>
                <input type="checkbox" id="javascript" name="checkbox" value="Javascrip">
                <label for="javascript">Javascript</label>
                <br>
                <input type="checkbox" id="java" name="checkbox" value="java">
                <label for="java">Java</label>
                <br>
                <input type="checkbox" id="python" name="checkbox" value="Python">
                <label for="python">Python</label>
                <br>
                <input type="checkbox" id="c-c++" name="checkbox" value="c/c++">
                <label for="c-c++">C/C++</label>
                <br>
                <br>
                <label class="label" for="url">Si tienes página web, indícanos la URL</label>
                <input type="url" name="url" id="url">
                <br>
                <br>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpiar">
            </form>
        </article>
    </section>

    </footer>
</body>
</html>
